<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      title/description/canonical/robots/og:*/twitter:* are intentionally
      omitted here — src/seo/SEO.jsx (backed by src/seo/meta.ts) renders them
      per-route via react-helmet-async, and scripts/prerender.mjs bakes the
      resulting <head> into dist/index.html at build time. This static
      fallback title only covers the pre-hydration flash / dev server.
    -->
    <title>ENVELOPE — Structured Leather Work Briefcase | Cairo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Space+Grotesk:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Google Consent Mode v2 — defaults, must run before GTM/gtag.js -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }

      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });

      // Re-apply a returning visitor's saved choice as the default so the
      // tags fire correctly on this load instead of waiting on the banner.
      (function () {
        try {
          var raw = localStorage.getItem('envelope01_consent_preferences');
          if (!raw) return;
          var saved = JSON.parse(raw);
          gtag('consent', 'default', {
            analytics_storage: saved.analytics ? 'granted' : 'denied',
            ad_storage: saved.ads ? 'granted' : 'denied',
            ad_user_data: saved.ads ? 'granted' : 'denied',
            ad_personalization: saved.ads ? 'granted' : 'denied'
          });
        } catch (e) {}
      })();
    </script>
    <!-- End Google Consent Mode v2 -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PX3PY4BBDL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-PX3PY4BBDL');
    </script>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5KVFC3QW');</script>
    <!-- End Google Tag Manager -->
  </head>

</html>
